

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Tasks</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>My Tasks</h1>
        <p>One step at a time ✨</p>

        <form class="task-form" id="task-form">
            <input type="text" id="task-input" placeholder="Enter a task..." required>
            <button type="submit">Add Task</button>
        </form>

        <div class="filters">
            <button class="filter active" data-filter="all" type="button">All</button>
            <button class="filter" data-filter="active" type="button">Active</button>
            <button class="filter" data-filter="completed" type="button">Completed</button>
        </div>

        <div class="stats">
            <span id="remaining-count">0 remaining</span>
            <span id="completed-count">0 completed</span>
        </div>

        <ul class="task-list" id="task-list"></ul>
    </div>

    <script src="script.js"></script>
</body>
</html>
